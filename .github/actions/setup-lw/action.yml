name: "Set up lw"
description: >
  Put meson and ninja on PATH and fetch the lw pinned in lw.pin through the
  repo-local launcher (./lw.sh).

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    # Unpinned on purpose.
    - name: Install meson and ninja
      shell: bash
      run: python -m pip install --upgrade meson ninja

    # The first launcher call downloads and verifies the pinned lw and its
    # bundle (retrying the download itself), so a network failure shows up
    # here rather than in the middle of a build. lw.sh also handles Windows
    # under Git Bash, so every leg uses it.
    - name: Fetch pinned lw
      shell: bash
      run: |
        set -euo pipefail
        ./lw.sh --no-input tools
        ./lw.sh --version
